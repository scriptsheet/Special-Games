<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Interface</title>
    <style>
        /* --- 1. THEME CUSTOMIZATION (Change colors here) --- */
        :root {
            --bg-color: #f4f7f6;       /* Page background */
            --card-bg: #ffffff;        /* Container background */
            --text-color: #333333;     /* Main text color */
            --accent-color: #4a90e2;   /* Header line and link hover color */
            --link-bg: #f8fafc;        /* Individual link button background */
            --link-border: #e2e8f0;    /* Border around links */
        }

        /* --- 2. BASE STYLES --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        /* --- 3. LINK GRID STYLES --- */
        .link-group {
            margin-bottom: 24px;
        }

        .group-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 4px;
            display: inline-block;
        }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* Style for the customizable link buttons */
        .custom-link {
            display: block;
            padding: 14px 18px;
            background-color: var(--link-bg);
            border: 1px solid var(--link-border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: all 0.2s ease;
        }

        /* Hover effect */
        .custom-link:hover {
            border-color: var(--accent-color);
            background-color: #f1f5f9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Change your title and subtitle here -->
        <h1>My Dashboard</h1>
        <p class="subtitle">Quick access to my favorite tools and websites.</p>

        <!-- LINK GROUP 1 -->
        <div class="link-group">
            <div class="group-title"> Adan14444's Projects (Credits to Adan) </div>
            <div class="link-grid">
                <a href="https://google.com" target="_blank" class="custom-link">🔍 Google Search</a>
                <a href=""></a>
            </div>
        </div>

        <!-- LINK GROUP 2 -->
        <div class="link-group">
            <div class="group-title">Entertainment</div>
            <div class="link-grid">
                <a href="https://youtube.com" target="_blank" class="custom-link">📺 YouTube</a>
                <a href="https://reddit.com" target="_blank" class="custom-link">🤖 Reddit</a>
            </div>
        </div>

    </div>

</body>
</html>
